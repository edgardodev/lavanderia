name: Upgrade Multer Once

on:
  push:
    branches:
      - hardening/admin-workflow
    paths:
      - .github/upgrade-multer.once

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/admin-workflow
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Upgrade multipart dependencies
        working-directory: backend
        run: npm install multer@2.3.0 @types/multer@2.2.0 --save
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "security: upgrade multer to 2.3.0"
          git push origin HEAD:hardening/admin-workflow
