name: Security Dependency Refresh Once

on:
  push:
    branches:
      - hardening/admin-workflow
    paths:
      - .github/security-deps.once

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/admin-workflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh backend runtime dependencies
        working-directory: backend
        run: |
          npm install firebase-admin@14.4.0 nanoid@latest express@latest --save
          npm audit fix || true
          npx prisma generate
          npm run build
          node scripts/audit-runtime.mjs

      - name: Refresh frontend runtime dependencies
        working-directory: frontend/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
          NEXT_PUBLIC_FIREBASE_API_KEY: test
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: test
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: test.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: test
          NEXT_PUBLIC_FIREBASE_APP_ID: test
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: test
        run: |
          npm install next@16.3.3 firebase@12.19.0 react@19.2.0 react-dom@19.2.0 --save
          npm audit fix || true
          npm run build
          node ../../backend/scripts/audit-runtime.mjs

      - name: Rebase latest branch and commit patched dependency locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json frontend/web/package.json frontend/web/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "security: refresh patched runtime dependencies"
          # Build tools may touch tracked generated metadata. Keep only the dependency commit.
          git reset --hard HEAD
          git fetch origin hardening/admin-workflow
          git rebase origin/hardening/admin-workflow
          git push origin HEAD:hardening/admin-workflow
