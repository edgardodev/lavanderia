name: Wire Idempotency Once

on:
  push:
    branches:
      - hardening/admin-workflow
    paths:
      - .github/wire-idempotency.once

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/admin-workflow
          fetch-depth: 0
      - name: Wire idempotent client routes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/src/server.ts')
          s = p.read_text()
          anchor = "import { registerAssistedRoutes } from './assisted.js';"
          addition = anchor + "\nimport { registerIdempotentClientServiceRoutes } from './client-services.js';"
          if "registerIdempotentClientServiceRoutes" not in s:
              s = s.replace(anchor, addition)

          anchor2 = "registerAssistedRoutes(app, prisma, requireUser, upload.array('photos'));"
          call = anchor2 + "\nregisterIdempotentClientServiceRoutes(app, prisma, requireUser);"
          if "registerIdempotentClientServiceRoutes(app" not in s:
              s = s.replace(anchor2, call)

          start = s.find("app.post('/api/reservations'")
          if start != -1:
              end = s.find("app.get('/api/admin/reservations'", start)
              if end == -1:
                  raise SystemExit('No se encontró fin de ruta antigua de reservas')
              s = s[:start] + s[end:]

          start = s.find("app.post('/api/orders'")
          if start != -1:
              end = s.find("app.post('/api/notifications/token'", start)
              if end == -1:
                  raise SystemExit('No se encontró fin de ruta antigua de órdenes')
              s = s[:start] + s[end:]

          p.write_text(s)
          PY
      - name: Validate backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/server.ts
          git diff --cached --quiet && exit 0
          git commit -m "resilience: wire idempotent client routes"
          git fetch origin hardening/admin-workflow
          git rebase origin/hardening/admin-workflow
          git push origin HEAD:hardening/admin-workflow
